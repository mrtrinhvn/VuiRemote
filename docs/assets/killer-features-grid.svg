    <text x="62" y="46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#99f6e4">Bắn Ảnh, File &amp; Video &gt;100MB</text>
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Photos auto-paste (<tspan fill="#34d399" font-weight="700">Ctrl+V</tspan>) into</text>
