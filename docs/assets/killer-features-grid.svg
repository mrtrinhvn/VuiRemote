    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• 1-Finger: <tspan fill="#34d399" font-weight="700">Drag &amp; Select</tspan>, <tspan fill="#60a5fa" font-weight="700">Scroll</tspan>,</text>
