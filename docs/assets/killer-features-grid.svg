    <text x="16" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Smart <tspan fill="#34d399" font-weight="700">⏱ 35s Auto-Sleep</tspan> drops CPU</text>
    <text x="24" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">usage to <tspan fill="#34d399" font-weight="700">0.0%</tspan> when idle; wakes in 10ms</text>
    <text x="16" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Dual-NIC Ethernet/Wi-Fi failover</text>
    <rect x="16" y="164" width="224" height="34" rx="8" fill="#083344" stroke="#06b6d4" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#67e8f9">0.0% Idle CPU • ~10MB RAM</text>
    <text x="128" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#a5f3fc">Đổi IP mạng vẫn tự nhận 100% không mất kết nối</text>
