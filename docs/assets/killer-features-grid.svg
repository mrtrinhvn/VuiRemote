    <rect x="14" y="14" width="38" height="38" rx="10" fill="#be123c" fill-opacity="0.45" stroke="#fb7185" stroke-width="1"/>
    <text x="33" y="39" text-anchor="middle" font-size="20">🛡️</text>
    <text x="62" y="29" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#fda4af">$0 Permanent URL &amp; PIN</text>
    <text x="62" y="46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fecdd3">Tên Miền Cố Định $0 &amp; Bảo Mật</text>
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Cloudflare Quick Tunnel + Gist +</text>
    <text x="24" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1"><tspan fill="#fda4af" font-weight="700">GitHub Pages</tspan> = Free Fixed Domain</text>
    <text x="16" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• <tspan fill="#34d399" font-weight="700">Home Wi-Fi</tspan>: Instant, zero PIN prompt</text>
    <text x="16" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• <tspan fill="#fbbf24" font-weight="700">4G/5G Internet</tspan>: PIN + 30d Cookie +</text>
    <text x="24" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">5-try / 15-min Brute-Force Lockout</text>
    <rect x="16" y="164" width="224" height="34" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#fda4af">TLS 1.3 + ConstantTimeCompare</text>
