    <text x="16" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Full 2K <tspan fill="#38bdf8" font-weight="700">2560×1440 yuvj444p</tspan> clarity</text>
    <rect x="16" y="164" width="224" height="34" rx="8" fill="#172554" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#93c5fd">[🪟 Windows] ➔ [🚀 Antigravity]</text>
