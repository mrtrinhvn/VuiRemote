    <rect x="16" y="164" width="224" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#6ee7b7">60Hz libXtst / Win32 SendInput</text>
    <text x="128" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#a7f3d0">Độ trễ ~0.1ms như Trackpad MacBook</text>
