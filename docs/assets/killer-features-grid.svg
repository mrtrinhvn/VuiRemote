    <text x="16" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Linux <tspan fill="#38bdf8" font-weight="700">GDM3 Pre-Login</tspan> &amp; GNOME</text>
    <text x="24" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Lock Curtain auto-lift via <tspan font-family="monospace">/dev/uinput</tspan></text>
    <text x="16" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Windows <tspan fill="#60a5fa" font-weight="700">Winlogon / UAC</tspan> desktop hook</text>
    <rect x="16" y="164" width="224" height="34" rx="8" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#fcd34d">WoL Magic Packet ➔ GDM3/Winlogon</text>
    <text x="128" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#fde68a">Bật máy &amp; nhập mật khẩu mở khóa từ xa</text>
