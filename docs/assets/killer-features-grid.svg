  <text x="560" y="60" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
    Zero Client App • Single Static Binary • Bilingual UI (EN / VI) • Designed for AI Agents (Antigravity, Claude Code, Cursor) &amp; Smart Home
  </text>

  <!-- Row 1, Card 1: 1-Tap File & 100MB+ Video Teleport -->
  <g transform="translate(24, 80)">
