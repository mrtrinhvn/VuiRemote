    <text x="16" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Built-in <tspan fill="#34d399" font-weight="700">Google TV TLS v2</tspan> pairing</text>
    <rect x="16" y="164" width="224" height="34" rx="8" fill="#500724" stroke="#ec4899" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#f9a8d4">Projector Lens + HDMI ➔ TV360</text>
