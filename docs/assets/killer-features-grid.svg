    <rect x="16" y="164" width="224" height="34" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="128" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#5eead4">Phone ➔ 20MB Chunks ➔ PC/TV</text>
    <text x="128" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#99f6e4">Tự dán ảnh vào khung chat AI tức thì</text>
