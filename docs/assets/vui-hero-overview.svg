<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header Title -->
  <text x="480" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" text-anchor="middle">
    🚀 VuiRemote — Điều Khiển Cả Ngôi Nhà &amp; Làm Việc Cùng AI Agent Từ Điện Thoại
  </text>
  <text x="480" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">
    1 Trang Web duy nhất • Độ trễ 12ms trong Wi-Fi nhà • Link cố định miễn phí qua 4G/5G khi ra ngoài
  </text>

  <!-- LEFT: Smartphone Controller -->
  <g transform="translate(45, 85)">
    <rect x="0" y="0" width="230" height="320" rx="26" fill="#111827" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="75" y="10" width="80" height="6" rx="3" fill="#334155"/>
    <!-- Phone Header -->
    <text x="20" y="38" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📱 VuiRemote</text>
    <rect x="145" y="24" width="68" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="179" y="36" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">● 2K 30fps</text>

    <!-- Live Screen Preview on Phone -->
    <rect x="14" y="48" width="202" height="118" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="66" fill="#60a5fa" font-family="monospace" font-size="9.5" font-weight="700">&gt; Google Antigravity IDE</text>
    <text x="24" y="82" fill="#94a3b8" font-family="monospace" font-size="8.5">✓ Build &amp; deploy completed</text>
    <text x="24" y="96" fill="#34d399" font-family="monospace" font-size="8.5">✓ All tests passing (4/4)</text>
    <rect x="24" y="108" width="182" height="22" rx="5" fill="#1e293b"/>
    <text x="32" y="122" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9">🎙️ "Triển khai thêm tính năng..."</text>
    <text x="115" y="156" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">🔍 Zoom 10x • Chuột 1:1 • Gõ Tiếng Việt</text>

    <!-- Quick Action Buttons on Phone -->
    <rect x="14" y="176" width="97" height="32" rx="8" fill="#1d4ed8"/>
    <text x="62" y="196" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">🚀 Antigravity</text>
    <rect x="119" y="176" width="97" height="32" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="167" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">🪟 Đổi Cửa Sổ</text>

    <rect x="14" y="216" width="63" height="30" rx="8" fill="#0d2818" stroke="#22c55e"/>
    <text x="45" y="235" fill="#86efac" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">⚡ Bật PC</text>
    <rect x="83" y="216" width="64" height="30" rx="8" fill="#1e293b"/>
    <text x="115" y="235" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">🔓 Mở Khóa</text>
    <rect x="153" y="216" width="63" height="30" rx="8" fill="#1e293b"/>
    <text x="184" y="235" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">🎙️ Giọng Nói</text>

    <!-- Bottom Mode Badge -->
    <rect x="14" y="258" width="202" height="46" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="115" y="276" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🏠 Ở nhà: Wi-Fi LAN (Miễn hỏi PIN)</text>
    <text x="115" y="294" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🌍 Ra ngoài: 4G/5G + Khóa PIN</text>
  </g>

  <!-- CENTER: Dual Connection Paths -->
  <g transform="translate(295, 130)">
    <!-- Top Path: Local Wi-Fi -->
    <rect x="0" y="0" width="215" height="90" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="107" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🏠 Mạng LAN / Wi-Fi Gia Đình</text>
    <text x="107" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">• Độ trễ siêu thấp 12ms - 15ms</text>
    <text x="107" y="61" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">• Tự nhận diện qua UDP Mesh :19888</text>
    <text x="107" y="78" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Mở tức thì (Không cần nhập PIN)</text>

    <!-- Bottom Path: 4G/5G Internet -->
    <rect x="0" y="115" width="215" height="110" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="107" y="139" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🌍 Ngoài Đường (4G / 5G Miễn Phí)</text>
    <text x="107" y="159" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">• Cloudflare Tunnel (Không mở Port)</text>
    <text x="107" y="176" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Link cố định: username.github.io/vui</text>
    <text x="107" y="193" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">• Bảo mật PIN + Khóa IP chống dò</text>
    <text x="107" y="210" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">• Mất điện có lại tự đồng bộ link mới</text>
  </g>

  <!-- RIGHT: Home Devices Ecosystem -->
  <g transform="translate(535, 85)">
    <!-- Card 1: Windows 10/11/Server & Linux PC with AI Agents -->
    <rect x="0" y="0" width="380" height="112" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <text x="18" y="25" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="800">💻 Windows 10 / 11 / LTSC / Server &amp; Linux (PC / Laptop)</text>
    <text x="18" y="45" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• Ra ngoài vẫn điều khiển <tspan fill="#38bdf8" font-weight="700">Antigravity, Claude Code, Codex</tspan></text>
    <text x="18" y="63" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Chạy độc lập 1 file <tspan font-family="monospace" fill="#93c5fd">.exe</tspan> (Win 10/11/Server) • Hình 2K/4K sắc nét</text>
    <text x="18" y="81" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Bật máy từ xa (<tspan fill="#4ade80" font-weight="700">Wake-on-LAN</tspan>) &amp; Mở khóa màn hình Win / Linux</text>
    <text x="18" y="99" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Chuột 1:1, kéo thả, cuộn 2 ngón &amp; đọc giọng nói Tiếng Việt</text>

    <!-- Card 2: Android TV Box -->
    <rect x="0" y="124" width="380" height="92" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="149" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">📺 Android TV Box (TX3 Mini, Mecool, Shield TV...)</text>
    <text x="18" y="169" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Bàn phím/Chuột/Cảm ứng ảo trực tiếp trong nhân Linux (<tspan font-family="monospace" fill="#6ee7b7">/dev/uinput</tspan>)</text>
    <text x="18" y="187" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Chuyển kênh, tìm kiếm giọng nói, dọn RAM chống đơ không cần rút điện</text>
    <text x="18" y="204" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Đóng vai trò Hub tiết kiệm điện chạy 24/7 đánh thức các máy tính trong nhà</text>

    <!-- Card 3: Smart Projector -->
    <rect x="0" y="228" width="380" height="92" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="253" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">📽️ Máy Chiếu Thông Minh (KAW, Hyundai, Wanbo...)</text>
    <text x="18" y="273" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Tự động nắn phẳng khung hình nghiêng (<tspan fill="#fde68a" font-weight="700">Hardware Keystone Dewarp</tspan>)</text>
    <text x="18" y="291" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Chỉnh lấy nét thấu kính (Focus +/-), tắt đèn hình nghe nhạc từ xa</text>
    <text x="18" y="308" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">• Chạm chuẩn xác 1:1 ngay cả khi máy chiếu đặt lệch góc phòng</text>
  </g>
</svg>
